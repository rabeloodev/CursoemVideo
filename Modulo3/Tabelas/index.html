<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 21 - Tabelas</title>
    <style>
        body {
            background-color: aliceblue;
            color: black;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            color: aliceblue;
        }

        td {
            border: 3px dashed black;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }

        .numero {
            text-align: right;
            vertical-align: bottom;
        }
        #bg {
            border-radius: 8px;
            background-image: linear-gradient(to left, red 50%, rgb(0, 76, 255) 50%);
        }
    </style>
</head>
<body>
    <!--
        hieraquia de tabelas (simples)
        table = tabela 
            table row = linha de tabela
                table header = cabeçalho de tabela
                table data = dado de tabela

    -->
    <h1>Tabelas</h1>
    <table id="bg">
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td class="numero">A2</td>
            <td>B2</td>
            <td>C3</td>
        </tr>
        <tr>
            <td class="numero">A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td class="numero">C4</td>
        </tr>
    </table>
</body>
</html>
