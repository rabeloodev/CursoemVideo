<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Células</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
        }

        td {
            border: 3px solid black;
            padding: 10px;
            text-align: center;
        }
        td {
            height: 50px;
        }

        td {
            background-color: red
        }
        td.impar {
            background-color: blue
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td class="impar">1</td>
            <td colspan="2">2</td>
            <td colspan="3" class="impar">3</td>
        </tr>

        <tr>
            <td rowspan="2">4</td>
            <td class="impar">5</td>
            <td rowspan="2">6</td>
        </tr>

        <tr>
            <td class="impar">7</td>
            <td colspan="2">8</td>
            <td colspan="2" class="impar">9</td>
        </tr>

        <tr>
            <td colspan="2">10</td>
            <td colspan="2" class="impar">11</td>
            <td>12</td>
            <td class="impar">13</td>
        </tr>
    </table>
</body>
</html>
